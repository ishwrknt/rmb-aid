# SMART installer copy. Keep project URLs independent of display branding.
startMessage: |
  SMART - Simulation Methodology based Agentic Research Tool

  Install the SMART pipeline in your coding assistant, then invoke
  rmbaid-smart-pipeline and describe your task in plain language.

  SMART asks you to approve a plan, implements it in phases, validates
  each deliverable, and records progress for the next session.

  Source and issues: https://github.com/ishwrknt/rmb-aid

