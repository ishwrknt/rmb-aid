# This file allows these modules under smart-code-org to also be installed with the smart method installer, while
# allowing us to keep the source of these projects in separate repos.

modules:
  smart-builder:
    url: https://github.com/smart-code-org/smart-builder
    module-definition: skills/module.yaml
    code: bmb
    name: "SMART Builder"
    description: "Agent and Builder"
    defaultSelected: false
    type: smart-org
    npmPackage: smart-builder

  smart-creative-intelligence-suite:
    url: https://github.com/smart-code-org/smart-module-creative-intelligence-suite
    module-definition: src/module.yaml
    code: cis
    name: "SMART Creative Intelligence Suite"
    description: "Creative tools for writing, brainstorming, and more"
    defaultSelected: false
    type: smart-org
    npmPackage: smart-creative-intelligence-suite

  smart-game-dev-studio:
    url: https://github.com/smart-code-org/smart-module-game-dev-studio.git
    module-definition: src/module.yaml
    code: gds
    name: "SMART Game Dev Studio"
    description: "Game development agents and workflows"
    defaultSelected: false
    type: smart-org
    npmPackage: smart-game-dev-studio

  smart-agentic-test-architecture-enterprise:
    url: https://github.com/smart-code-org/smart-agentic-test-architecture-enterprise
    module-definition: src/module.yaml
    code: tea
    name: "Test Architect"
    description: "Master Test Architect for quality strategy, test automation, and release gates"
    defaultSelected: false
    type: smart-org
    npmPackage: smart-agentic-test-architecture-enterprise

  whiteport-design-studio:
    url: https://github.com/smart-code-org/smart-agentic-wds-expansion
    module-definition: src/module.yaml
    code: wds
    name: "Whiteport Design Studio (For UX Professionals)"
    description: "Whiteport Design Studio (For UX Professionals)"
    defaultSelected: false
    type: community
    npmPackage: smart-agentic-wds-expansion
