name: Publish SMART

"on":
  workflow_dispatch:
    inputs:
      channel:
        description: "npm distribution channel"
        required: true
        default: "next"
        type: choice
        options:
          - next
          - latest

concurrency:
  group: smart-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'ishwrknt/rmb-aid' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Validate release checkout
        run: npm run quality
      - name: Pack tested release
        run: npm pack --pack-destination /tmp
      - name: Save release archive
        uses: actions/upload-artifact@v4
        with:
          name: smart-npm-package
          path: /tmp/smart-agentic-*.tgz
      - name: Publish tested archive
        run: npm publish /tmp/smart-agentic-*.tgz --access public --tag "$RELEASE_CHANNEL"
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
